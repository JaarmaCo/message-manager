spring:
  
  application:
    name: message-manager
  
  # Configure DB
  #
  jpa:

    # Use Postgres
    #
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    
    # Disables some noise from SQL command echoing
    #
    show-sql: false

    properties:
      hibernate:
        format_sql: true

  # Set DB location, driver and authentication
  #
  datasource:
    
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/messagemanager}
    
    driver-class-name: org.postgresql.Driver
    
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    
    password: ${SPRING_DATASOURCE_PASSWORD:testpw}

# Enable Swagger docs
#
springdoc:
  
  swagger-ui:
    enabled: true    
    path: /swagger-ui.html
  
  api-docs:
    enabled: true
    path: /v1/api-docs

