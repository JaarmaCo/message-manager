spring:
  
  application:
    name: message-manager
  
  # Configure DB
  #
  jpa:

    # Use Postgres
    #
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    
    # Disables some noise from SQL command echoing
    #
    show-sql: false

    properties:
      hibernate:
        format_sql: true

  # Set DB location, driver and authentication
  #
  datasource:
    
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/messagemanager}
    
    driver-class-name: org.postgresql.Driver
    
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    
    password: ${SPRING_DATASOURCE_PASSWORD:testpw}

# Local settings
app:
  
  api:
    domain-name: localhost:8080
    prefix: /api/v1
    public-endpoints:
      - method: GET
        path: /swagger-ui.html
      - method: GET
        path: /swagger-ui/**
      - method: GET
        path: /v3/api-docs
      - method: GET
        path: /v3/api-docs/**
      - method: GET
        path: /v3/api-docs-overlaid
      - method: GET
        path: ${app.api.prefix}/actuator/health
      - method: GET
        path: ${app.api.prefix}/actuator/echo

  jwt:
    secret: QW5vdGhlciBoYXBweSBsYW5kaW5nIC0gT2Jpd2FuIEtlbm9iaSAyMCBCQlkK 
    expiration: 86400000 # 24 h
  
  cors:
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
    allowed-paths: []

  openapi:
    base-url: http://localhost:8080

# Enable Swagger docs
#
springdoc:
  
  swagger-ui:
    enabled: true
    url: /v3/api-docs-overlaid
    path: /swagger-ui.html

  api-docs:
    enabled: true
    path: /v3/api-docs

