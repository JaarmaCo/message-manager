name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Maven)
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        name: Check out the repository

      - uses: actions/setup-java@v4
        name: Set up JVM and Maven
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run the test suite
        run: mvn -B -ntp verify

      - name: Upload surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  security:
    name: Check security (Trivy)
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        name: Check out the repository

      - uses: actions/setup-java@v4
        name: Set up JVM and Maven
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Cache dependency tree locally
        run: mvn -B -ntp -q dependency:resolve

      - name: Security scan (Trivy)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$HOME/.m2:/root/.m2:ro" \
            aquasec/trivy:latest \
            fs --scanners vuln \
               --offline-scan \
               --severity HIGH,CRITICAL \
               --dependency-tree \
               --exit-code 1 /repo
  
  ci-success:
    name: CI success
    if: always()
    needs:
      - test
      - security
    runs-on: ubuntu-latest
    steps:
      - name: Verify that all upstream jobs succeeded.
        run: |
          UPSTREAM_RESULTS="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $UPSTREAM_RESULTS"
          for r in $UPSTREAM_RESULTS; do
            if [[ "$r" != "success" ]]; then
              echo "[ERROR:ci:child] - One or more CI jobs failed."
              exit 1
            fi
          done
          echo "All jobs exited successfully"
